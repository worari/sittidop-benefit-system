version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 15+ Database Service
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: sittidop-postgres
    restart: always
    environment:
      POSTGRES_USER: "sitti"
      POSTGRES_PASSWORD: "V@radorn7887"
      POSTGRES_DB: "sittidop"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sittidop_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sitti -d sittidop" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # 2. Next.js 15 Web Application Service (with Prisma Migration on Startup)
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sittidop-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://sitti:V%40radorn7887@db:5432/sittidop"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "sittidop-enterprise-secure-jwt-secret-key-2026"
      NODE_ENV: "production"
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - sittidop_network

volumes:
  postgres_data:
    driver: local

networks:
  sittidop_network:
    driver: bridge
